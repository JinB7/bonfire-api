spring:
  application:
    name: game-curation
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/game_pick}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
